<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #17212b;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .card {
            background-color: #242f3d;
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 350px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .status-text {
            font-size: 16px;
            color: #f1c40f;
            margin-bottom: 20px;
            font-weight: 500;
        }
        .password-box {
            background-color: #17212b;
            border: 1px dashed #5288c1;
            border-radius: 8px;
            padding: 15px;
            font-size: 22px;
            font-weight: bold;
            color: #64b5f6;
            letter-spacing: 1px;
            margin-bottom: 20px;
            word-break: break-all;
            display: none;
        }
        .btn-copy {
            background-color: #2ea6ff;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            display: none;
            transition: background 0.2s;
        }
        .btn-copy:active {
            background-color: #1a8ad8;
        }
    </style>
</head>
<body>

<div class="card">
    <div id="status" class="status-text">Loading advertisement...</div>
    <div id="passwordBox" class="password-box"></div>
    <button id="copyBtn" class="btn-copy" onclick="copyPassword()">📋 Copy Password</button>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Adsterra Direct Link URL
    const AD_URL = "https://www.po38trk.com/4g9f3900?key=901a1c3bb5bfadbb0c0f993d077c5708";

    // Standard FiberHome Password Algorithm
    function generatePassword(name) {
        if (!name) return "Invalid Input";
        let cleanName = name.replace(/^Fh_/i, '').trim();
        if (cleanName.length < 6) return "Invalid Router Name";
        
        let prefix = cleanName.substring(0, 2);
        let middle = cleanName.substring(2, 4);
        let suffix = cleanName.substring(4, 6);
        
        return `a4b1c${suffix}${middle}${prefix}`;
    }

    // Extract 'name' param from URL
    const urlParams = new URLSearchParams(window.location.search);
    const routerName = urlParams.get('name') || '';
    const generatedPassword = generatePassword(routerName);

    window.onload = function() {
        // Automatically trigger ad redirect without manual button clicking
        setTimeout(() => {
            window.open(AD_URL, '_blank');
            
            // Show password immediately after triggering ad
            document.getElementById('status').innerText = "Password Unlocked!";
            document.getElementById('status').style.color = "#2ecc71";
            
            const pBox = document.getElementById('passwordBox');
            pBox.innerText = generatedPassword;
            pBox.style.display = "block";
            
            document.getElementById('copyBtn').style.display = "block";
        }, 800);
    };

    function copyPassword() {
        navigator.clipboard.writeText(generatedPassword).then(() => {
            tg.showAlert("Password copied to clipboard!");
        }).catch(() => {
            tg.showAlert("Copy failed. Please copy manually.");
        });
    }
</script>
</body>
</html>
