<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ad Verification</title>

    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Monetag SDK -->
    <script src="https://libtl.com/sdk.js" data-zone="11487502" data-sdk="show_11487502"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #17212b;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .card {
            background-color: #242f3d;
            border-radius: 12px;
            padding: 30px 20px;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .status-text {
            font-size: 15px;
            color: #64b5f6;
            margin-bottom: 24px;
            font-weight: 500;
            line-height: 1.4;
        }
        .btn-watch {
            background-color: #2ea6ff;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .btn-watch:disabled {
            background-color: #555555;
            cursor: not-allowed;
            opacity: 0.7;
        }
    </style>
</head>
<body>

<div class="card">
    <div id="status" class="status-text">Click the button below to watch the ad and unlock your Wi-Fi password.</div>
    <button id="adBtn" class="btn-watch" onclick="watchRewardedAd()">🎬 Watch Ad to Unlock</button>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const urlParams = new URLSearchParams(window.location.search);
    const routerName = urlParams.get('name') || '';
    const chatId = tg.initDataUnsafe?.user?.id || urlParams.get('chat_id') || '';

    function watchRewardedAd() {
        const btn = document.getElementById('adBtn');
        const status = document.getElementById('status');

        btn.disabled = true;
        status.innerText = "Loading ad...";
        status.style.color = "#f1c40f";

        if (typeof show_11487502 === 'function') {
            show_11487502().then(() => {
                status.innerText = "✅ Ad verified! Sending password to chat...";
                status.style.color = "#2ecc71";

                fetch('/api/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: routerName,
                        chat_id: chatId
                    })
                }).then(() => {
                    setTimeout(() => { tg.close(); }, 1000);
                }).catch(err => {
                    console.error("API error:", err);
                    tg.close();
                });

            }).catch((err) => {
                console.error("Ad closed early or failed:", err);
                status.innerText = "❌ You must watch the entire ad to receive your password.";
                status.style.color = "#e74c3c";
                btn.disabled = false;
            });
        } else {
            status.innerText = "⚠️ Ad network loading... Please try again in 3 seconds.";
            status.style.color = "#e67e22";
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
