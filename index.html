<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FiberHome Password</title>
<script src="https://telegram.org/js/telegram-web-app.js" defer></script>
<script src="https://sad.adsgram.ai/js/sad.min.js" defer></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Roboto, Segoe UI, sans-serif;
    background: var(--tg-theme-bg-color, #0e0e14);
    color: var(--tg-theme-text-color, #ffffff);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    text-align: center;
  }
  .card {
    width: 100%;
    max-width: 360px;
  }
  .router-name {
    font-size: 15px;
    opacity: 0.7;
    margin-bottom: 6px;
  }
  .router-value {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 28px;
    direction: ltr;
  }
  button {
    width: 100%;
    padding: 16px;
    font-size: 17px;
    font-weight: 600;
    border: none;
    border-radius: 14px;
    background: var(--tg-theme-button-color, #6C5CE7);
    color: var(--tg-theme-button-text-color, #ffffff);
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; }
  .status {
    margin-top: 18px;
    font-size: 14px;
    opacity: 0.8;
    min-height: 20px;
  }
  .password-box {
    display: none;
    margin-top: 24px;
    padding: 20px;
    border-radius: 14px;
    background: rgba(255,255,255,0.06);
  }
  .password-box.show { display: block; }
  .password-value {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 1px;
    direction: ltr;
    margin-bottom: 14px;
    word-break: break-all;
  }
  .copy-btn {
    background: #22c55e;
  }
  .error {
    color: #ff6b6b;
    margin-top: 18px;
    font-size: 15px;
  }
  .hourglass {
    font-size: 40px;
    margin-bottom: 10px;
  }
  .loading-note {
    margin-top: 40px;
    font-size: 13px;
    opacity: 0.5;
  }
</style>
</head>
<body>

<div class="card">
  <div id="routerLabel" class="router-name">اسم الراوتر</div>
  <div id="routerValue" class="router-value">-</div>

  <button id="revealBtn" disabled>⏳ جاري التحميل...</button>

  <div id="status" class="status"></div>

  <div id="passwordBox" class="password-box">
    <div id="passwordValue" class="password-value"></div>
    <button id="copyBtn" class="copy-btn">📋 نسخ الباسوورد</button>
  </div>

  <div id="errorBox" class="error" style="display:none;"></div>
</div>

<script>
window.addEventListener('DOMContentLoaded', function () {

const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

// ---- read router name from URL query param ----
const params = new URLSearchParams(window.location.search);
const routerName = (params.get('name') || '').trim();

document.getElementById('routerValue').textContent = routerName || '(غير محدد)';

// ---- password generation logic (mirrors the Python bot) ----
function swapChar(ch) {
  const val = parseInt(ch, 16);
  return (15 - val).toString(16);
}

function getPassword(name) {
  let n = name.trim().toLowerCase().replace(/^fh[_-]?/, '');
  if (!n || !/^[0-9a-f]+$/.test(n)) {
    throw new Error('اسم الراوتر غير صالح');
  }
  const swapped = n.split('').map(swapChar).join('');
  return 'wlan' + swapped;
}

// ---- Adsgram init ----
const AdController = window.Adsgram ? window.Adsgram.init({ blockId: "int-40807" }) : null;

const revealBtn = document.getElementById('revealBtn');
const statusEl = document.getElementById('status');
const passwordBox = document.getElementById('passwordBox');
const passwordValue = document.getElementById('passwordValue');
const errorBox = document.getElementById('errorBox');
const copyBtn = document.getElementById('copyBtn');

// enable the button now that everything is loaded
revealBtn.disabled = false;
revealBtn.textContent = '🔓 مشاهدة إعلان و كشف الباسوورد';

function showPassword() {
  try {
    const pwd = getPassword(routerName);
    passwordValue.textContent = pwd;
    passwordBox.classList.add('show');
    statusEl.textContent = '';
    revealBtn.style.display = 'none';
  } catch (e) {
    errorBox.style.display = 'block';
    errorBox.textContent = e.message;
  }
}

revealBtn.addEventListener('click', () => {
  if (!routerName) {
    errorBox.style.display = 'block';
    errorBox.textContent = 'لم يتم استلام اسم الراوتر. افتح الزر من داخل البوت بعد إرسال الاسم.';
    return;
  }

  revealBtn.disabled = true;
  statusEl.innerHTML = '<div class="hourglass">⏳</div>جاري تحميل الإعلان...';

  if (!AdController) {
    // Fallback: no ad network loaded, still show password after 5s
    setTimeout(showPassword, 5000);
    return;
  }

  AdController.show()
    .then(() => {
      // Ad watched fully -> reveal password
      showPassword();
    })
    .catch((result) => {
      // Ad failed/skipped/not available -> you can choose to still reveal
      // or block. Here we still reveal after a short wait to not lose customers.
      statusEl.textContent = 'تعذر عرض الإعلان، جاري المتابعة...';
      setTimeout(showPassword, 2000);
    });
});

copyBtn.addEventListener('click', () => {
  navigator.clipboard.writeText(passwordValue.textContent).then(() => {
    copyBtn.textContent = '✅ تم النسخ';
    setTimeout(() => { copyBtn.textContent = '📋 نسخ الباسوورد'; }, 1500);
  });
});

}); // end DOMContentLoaded
</script>

</body>
</html>
