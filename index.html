<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watching Ad</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #17212b;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .card {
            background-color: #242f3d;
            border-radius: 12px;
            padding: 30px 20px;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .timer-circle {
            font-size: 42px;
            font-weight: bold;
            color: #64b5f6;
            margin: 20px 0;
        }
        .status-text {
            font-size: 15px;
            color: #e0e0e0;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="status-text">Please wait for the ad timer to finish to unlock your password...</div>
    <div id="timer" class="timer-circle">10</div>
    <div id="subtext" style="font-size: 12px; color: #888;">Do not close this window</div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const AD_URL = "https://www.po38trk.com/4g9f3900?key=901a1c3bb5bfadbb0c0f993d077c5708";
    const REQUIRED_SECONDS = 10;
    
    let timeLeft = REQUIRED_SECONDS;
    const timerDisplay = document.getElementById('timer');
    
    // استخراج اسم الراوتر من الرابط
    const urlParams = new URLSearchParams(window.location.search);
    const routerName = urlParams.get('name') || '';

    // فتح الإعلان تلقائياً عند التحميل
    window.onload = function() {
        window.open(AD_URL, '_blank');
        
        const countdown = setInterval(() => {
            timeLeft--;
            timerDisplay.innerText = timeLeft;
            
            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerDisplay.innerText = "✓";
                timerDisplay.style.color = "#2ecc71";
                document.getElementById('subtext').innerText = "Verifying...";
                
                // إرسال البيانات للبوت وإغلاق الميني آب فوراً
                setTimeout(() => {
                    tg.sendData(JSON.stringify({ name: routerName }));
                    tg.close();
                }, 500);
            }
        }, 1000);
    };
</script>
</body>
</html>
